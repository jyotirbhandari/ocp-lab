apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: registry.access.redhat.com/ubi9/nginx-124
        command: ["nginx", "-g", "daemon off;"]
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: content
          mountPath: /opt/app-root/src
        - name: proxy
          mountPath: /opt/app-root/etc/nginx.default.d
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: content
        configMap:
          name: nginx-content
      - name: proxy
        configMap:
          name: nginx-proxy
