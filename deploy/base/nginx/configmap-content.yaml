apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-content
  labels:
    app: nginx
data:
  index.html: |
    <!doctype html>
    <html>
    <head><meta charset="utf-8"><title>Bookstore</title></head>
    <body style="font-family: sans-serif; max-width: 700px; margin: 2rem auto;">
      <h1>📚 Bookstore</h1>
      <p id="info">loading...</p>
      <ul id="books"></ul>
      <script>
        fetch('/api/info').then(r => r.json()).then(d =>
          document.getElementById('info').textContent =
            'Served by API pod: ' + d.pod + ' (version ' + d.version + ')');
        fetch('/api/books').then(r => r.json()).then(books =>
          document.getElementById('books').innerHTML = books.map(b =>
            '<li><b>' + b.title + '</b> by ' + b.author + ' ($' + b.price + ')</li>').join(''));
      </script>
    </body>
    </html>
