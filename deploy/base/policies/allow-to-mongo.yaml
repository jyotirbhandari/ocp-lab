apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-mongo
spec:
  podSelector:
    matchLabels:
      app: mongo
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values: ["api", "db-migrate"]
    ports:
    - port: 27017
      protocol: TCP
