apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  labels:
    app: pg-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: pg-backup
        spec:
          restartPolicy: Never
          containers:
          - name: pg-dump
            image: quay.io/sclorg/postgresql-16-c9s
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -e
              FILE=/backups/bookstore-$(date +%Y%m%d-%H%M%S).sql
              pg_dump --clean --if-exists -f "$FILE"
              echo "backup written: $FILE"
              find /backups -name '*.sql' -mtime +7 -delete
              ls -lh /backups
            env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRESQL_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRESQL_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRESQL_DATABASE
            volumeMounts:
            - name: backups
              mountPath: /backups
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: pg-backups
