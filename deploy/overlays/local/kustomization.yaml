apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookstore
resources:
- namespace.yaml
- ../../base
- ingress.yaml
images:
- name: ghcr.io/jyotirbhandari/bookstore-api
  newTag: sha-b41a021
patches:
- target:
    kind: Deployment
    name: nginx
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
- target:
    kind: HorizontalPodAutoscaler
    name: api
  patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 1
