apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstore
  labels:
    app: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: bookstore.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              name: http
