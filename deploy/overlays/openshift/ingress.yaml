apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstore
  labels:
    app: nginx
  annotations:
    route.openshift.io/termination: edge
spec:
  ingressClassName: openshift-default
  rules:
  - host: bookstore-jyotirbhandari-dev.apps.rm1.0a51.p1.openshiftapps.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              name: http
